name: archive

# 每天 23:05（北京时间 = 15:05 UTC）抓一次 RSS：
#   1. archive/<日期>.json     —— 结构化快照（给 archive-merge / 模型成稿用）
#   2. digest/<日期>.md        —— 人可读的 Markdown（手机上直接看，不需要本机）
# 跑在 GitHub 的机器上，跟用户电脑开不开机无关；抓取逻辑来自 npm 上的 dsh-search-contrl。
on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install collector
        run: npm install dsh-search-contrl@latest --no-save --no-audit --no-fund

      - name: Collect snapshot
        run: |
          DAY="$(TZ=Asia/Shanghai date +%F)"
          node node_modules/dsh-search-contrl/scripts/daily-collect.mjs \
            --date="$DAY" --archive=archive --max=60 --others-max=120
          node node_modules/dsh-search-contrl/scripts/archive-digest.mjs \
            --date="$DAY" --max=6 --out="digest/${DAY}.md"
          ls -la archive | tail -3
          ls -la digest | tail -3

      - name: Commit
        run: |
          git config user.name "dsh-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive digest
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "archive: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: Summary
        run: |
          DAY="$(TZ=Asia/Shanghai date +%F)"
          echo "### 归档 $DAY" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la archive | tail -4 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "digest/digest/${DAY}.md" >> "$GITHUB_STEP_SUMMARY"
