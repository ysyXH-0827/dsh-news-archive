name: weekly

# 每周一 00:20（北京时间 = 周日 16:20 UTC）把上周的归档拼成一份周报素材：
#   digest/weekly-<今天>.md
# 同样跑在 GitHub 上，用户不用开机；内容只是脚本级汇总（无模型），
# 需要成稿时再让 DSH 读这份 Markdown 或本地 archive-pull 后的 JSON。
on:
  schedule:
    - cron: '20 16 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install collector
        run: npm install dsh-search-contrl@latest --no-save --no-audit --no-fund

      - name: Merge last 7 days
        run: |
          DAY="$(TZ=Asia/Shanghai date +%F)"
          node node_modules/dsh-search-contrl/scripts/archive-merge.mjs \
            --date="$DAY" --days=7 --out="reports/week-${DAY}.json" 2>>merge.log
          node node_modules/dsh-search-contrl/scripts/archive-digest.mjs \
            --file="reports/week-${DAY}.json" --window=all --max=10 \
            --out="digest/weekly-${DAY}.md"
          cat merge.log >> "$GITHUB_STEP_SUMMARY"
          head -40 "digest/weekly-${DAY}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Commit
        run: |
          git config user.name "dsh-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add digest reports merge.log
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "weekly: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi
