name: archive

# 每天 23:05（北京时间 = 15:05 UTC）抓一次 RSS，把快照提交到 archive/<日期>.json。
# 跑在 GitHub 的机器上，跟本机开不开机无关；抓取逻辑来自 npm 上的 dsh-search-contrl 包。
on:
  schedule:
    - cron: '5 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install collector
        run: npm install dsh-search-contrl@latest --no-save --no-audit --no-fund

      - name: Collect snapshot
        run: |
          node node_modules/dsh-search-contrl/scripts/daily-collect.mjs \
            --date="$(TZ=Asia/Shanghai date +%F)" \
            --archive=archive --max=60 --others-max=120
          ls -la archive | tail -5

      - name: Commit snapshot
        run: |
          git config user.name "dsh-archive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add archive
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "archive: $(TZ=Asia/Shanghai date +%F)"
            git push
          fi

      - name: Summary
        run: |
          echo "### 归档 $(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -la archive | tail -6 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
